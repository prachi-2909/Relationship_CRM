name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t rcrm-backend ./backend
      - run: docker build -t rcrm-frontend ./frontend
      - name: Smoke-test the stack
        run: |
          cp .env.example .env
          docker compose up -d
          for i in $(seq 1 20); do
            curl -sf http://localhost:8010/api/v1/health && break
            sleep 3
          done
          curl -sf http://localhost:8010/api/v1/health
          for i in $(seq 1 20); do
            curl -sf http://localhost/ >/dev/null && break
            sleep 3
          done
          curl -sf http://localhost/ >/dev/null
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
