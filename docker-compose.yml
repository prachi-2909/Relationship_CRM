# Production-shaped stack: nginx (frontend) -> FastAPI (backend) -> SQLite on a named volume.
# Only the frontend is published, and only on 127.0.0.1:CRM_HOST_PORT: on a shared server a host
# reverse proxy (Nginx) routes https://<domain>/<PUBLIC_BASE_PATH>/ to it, so no application port
# is ever exposed to the network. The backend has no host port; the frontend proxies /api to it. Copy .env.example to
# .env at the repo root to override SECRET_KEY / LLM_* before deploying
# anywhere real; sane defaults let `docker compose up` work out of the box
# for a local look.
#
# SESSION_COOKIE_SECURE defaults to true here: this stack ships no TLS
# termination of its own (nginx.conf only listens on :80), and a Secure
# cookie is dropped by the browser over plain HTTP - fails CLOSED (login
# simply won't persist) rather than silently shipping session cookies in
# cleartext to anyone on the network path. `http://localhost` is exempt
# from this by every major browser, so local use is unaffected. Deploying
# anywhere reachable by others means putting a TLS-terminating reverse
# proxy in front (this compose file does not provide one); only set
# SESSION_COOKIE_SECURE=false for a deployment you specifically intend to
# stay on an isolated, trusted network with no TLS.
name: sbi-relationship-crm

services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite+pysqlite:////app/data/relationship_crm.db
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost"]}'
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Scope the session cookie to the public sub-path so it is not sent to other apps on the domain.
      SESSION_COOKIE_PATH: ${PUBLIC_BASE_PATH:-/}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-stub}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # DPDP master switch; when false the app sends nothing to any AI endpoint.
      AI_DATA_PROCESSING_ENABLED: ${AI_DATA_PROCESSING_ENABLED:-true}
      # Transcription runs on THIS server only (the `transcription` service below), reached over the
      # internal compose network - call audio never leaves the host. Override the URL only to point
      # at another in-house host; never a third party for production (DPDP).
      # "openai" = call the OpenAI-compatible service above (the default "local_whisper" would run
      # faster-whisper inside this image, which does not ship it).
      TRANSCRIPTION_PROVIDER: openai
      # Who places an outgoing call. The Android app dials through the phone's own SIM; with the default
      # "knowlarity" and no Knowlarity configured the server answers channel "manual" and the app never
      # opens the dialer.
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-android_native}
      TRANSCRIPTION_BASE_URL: ${TRANSCRIPTION_BASE_URL:-http://transcription:8000/v1}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}
      # CPU Whisper runs about real-time, so allow minutes (not the 60 s default) for a long call.
      TRANSCRIPTION_TIMEOUT_SECONDS: ${TRANSCRIPTION_TIMEOUT_SECONDS:-900}
    volumes:
      - crm-data:/app/data
    restart: unless-stopped

  # Self-hosted speech-to-text (OpenAI-compatible /v1/audio/transcriptions). On-server only: it is
  # NOT published to any host port, so only the backend on the internal network can reach it.
  # Default is the CPU image with a small model so it runs on any server; for production Indian-
  # language accuracy use the CUDA image and a larger model - see deploy/self-hosted-ai/README.md.
  transcription:
    image: ${TRANSCRIPTION_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    environment:
      WHISPER__MODEL: ${TRANSCRIPTION_MODEL:-Systran/faster-whisper-small}
    volumes:
      - hf-cache:/root/.cache/huggingface
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${PUBLIC_BASE_PATH:-/}
    ports:
      # Localhost only; pick a free port on the server (sudo ss -lntp) and set CRM_HOST_PORT in .env.
      - "127.0.0.1:${CRM_HOST_PORT:?set CRM_HOST_PORT in .env to a free host port}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crm-data:
  hf-cache:
