# Mirrors the dev proxy in vite.config.ts: same relative /api path, so the
# frontend code needs no environment-specific base URL.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Voice-note / call-recording uploads (the API caps a file at 20 MB).
    client_max_body_size 25m;

    # Compress the text assets: the JS bundle is ~850 KB raw and several times smaller gzipped, which matters
    # on a slow or mobile link. Audio and images are already compressed, so they are left out.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # Publishing a new app version uploads an APK (~30 MB), far bigger than any other upload. Admin only; the API
    # checks the role and caps it at 100 MB.
    location = /api/v1/app/release {
        client_max_body_size 100m;
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing: let React Router handle any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
